name: tests
on: [push, pull_request, workflow_dispatch]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true     # sources/AUVSimBench and sources/FrameForge at their pinned commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3 pytest==9.1.0
      # ros2bag_convert.py (Apache-2.0) is fetched at a pinned commit, never vendored.
      - run: |
          mkdir -p "$RUNNER_TEMP/ros2bag"
          curl -fsSL -o "$RUNNER_TEMP/ros2bag/ros2bag_convert.py" \
            https://raw.githubusercontent.com/wuisabel-gif/ros2bag_converter/77beec688e6e82e4db657fc1ca76c41689eba58d/skills/ros2bag-converter/scripts/ros2bag_convert.py
          echo "ROBOTICS_TOOLS_ROS2BAG=$RUNNER_TEMP/ros2bag/ros2bag_convert.py" >> "$GITHUB_ENV"
      - run: python -m pytest tests -q
      # the installed package must work away from the checkout (no submodule on the path)
      - run: |
          pip install .
          cd "$RUNNER_TEMP" && robotics-tools arm --fault enc_j2_0.1 --profile hold | grep "ranking: encoder_offset_j2"

