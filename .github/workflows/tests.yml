name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.1.3 pytest==9.1.0
      # sources/ is not tracked here; AUVSimBench (Apache-2.0) is checked out at the pinned commit.
      - uses: actions/checkout@v4
        with:
          repository: wuisabel-gif/AUVSimBench
          ref: 7003e8dfa79a89810561dbef0e0e8eb93223932b
          path: sources/AUVSimBench
      # ros2bag_convert.py (Apache-2.0) is fetched at a pinned commit, never vendored.
      - run: |
          mkdir -p "$RUNNER_TEMP/ros2bag"
          curl -fsSL -o "$RUNNER_TEMP/ros2bag/ros2bag_convert.py" \
            https://raw.githubusercontent.com/wuisabel-gif/ros2bag_converter/77beec688e6e82e4db657fc1ca76c41689eba58d/skills/ros2bag-converter/scripts/ros2bag_convert.py
          echo "ROBOTFAULTLAB_ROS2BAG=$RUNNER_TEMP/ros2bag/ros2bag_convert.py" >> "$GITHUB_ENV"
      - run: python -m pytest tests -q
